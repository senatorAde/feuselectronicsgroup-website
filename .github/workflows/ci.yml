# ============================================================================
# FEUS-Web — CI/CD Pipeline (Vercel)
# ============================================================================
# Verifies build on every push. Vercel handles deployment automatically.
# Validates public assurance data and enforces the Session 13A claims
# baseline: quarantined roi-stats.json must NOT exist (demo-constant ROI
# figures are prohibited public claims).
# ============================================================================

name: FEUS-Web CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Public claims gate
        run: npm test

      - name: Validate public data (Session 13A claims baseline)
        run: |
          echo "Checking quarantined files are absent..."
          if [ -f public/data/roi-stats.json ]; then
            echo "::error title=Quarantined file present::public/data/roi-stats.json must not exist (Session 13A claims baseline)"
            exit 1
          fi
          echo "Validating assurance-stats.json..."
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('public/data/assurance-stats.json', 'utf8'));
            for (const key of ['assurance', 'certification', 'audit_chain', 'data_provenance']) {
              if (!data[key]) {
                console.error('Missing required key:', key);
                process.exit(1);
              }
            }
            const text = JSON.stringify(data);
            if (/logs\//.test(text) || text.includes('latest_run_id')) {
              console.error('Internal paths or run identifiers must not be published (DATA-006)');
              process.exit(1);
            }
            console.log('assurance-stats.json valid');
          "

      - name: Build production bundle
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build output directory 'dist' not found"
            exit 1
          fi
          if [ -f "dist/data/roi-stats.json" ]; then
            echo "❌ Quarantined roi-stats.json found in build output (Session 13A claims baseline)"
            exit 1
          fi
          if [ ! -f "dist/data/assurance-stats.json" ]; then
            echo "❌ assurance-stats.json not found in build output"
            exit 1
          fi
          echo "✅ Build output verified"
          echo "   Files: $(find dist -type f | wc -l)"
          echo "   Size: $(du -sh dist | cut -f1)"
