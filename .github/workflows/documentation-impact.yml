name: Documentation impact
on:
  pull_request:
    branches: [main]
  push:
    branches: ["feature/**", "release/**"]
permissions:
  contents: read
  pull-requests: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify documentation impact
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ "$base" == "0000000000000000000000000000000000000000" || -z "$base" ]]; then
            base="$(git merge-base origin/main "$HEAD_SHA")"
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git checkout --detach "$HEAD_SHA"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" > "$RUNNER_TEMP/pages.json"
            python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"]); pages=json.loads((p/"pages.json").read_text()); (p/"reviews.json").write_text(json.dumps([r for page in pages for r in page]))'
            python scripts/check_documentation_impact.py --base "$base" --reviews "$RUNNER_TEMP/reviews.json"
          else
            python scripts/check_documentation_impact.py --base "$base"
          fi
